services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: technostrelka
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/01-init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d technostrelka"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Local free LLM (optional): llama.cpp server (OpenAI-compatible).
  # Put a GGUF model file into ./models/ (see README).
  llm:
    profiles: ["llm"]
    image: ghcr.io/ggml-org/llama.cpp:server
    command:
      ["-m", "/models/qwen2.5-0.5b-instruct-q4_k_m.gguf", "--host", "0.0.0.0", "--port", "8080", "-c", "2048", "--threads", "4"]
    volumes:
      - ./models:/models
    restart: unless-stopped

  api:
    build: .
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 25s
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/technostrelka
      SECRET_KEY: docker-dev-secret-change-me
      ADMIN_API_KEY: docker-admin-key
      PUBLIC_BASE_URL: http://localhost:8000
      UPLOAD_DIR: /app/uploads
      INGEST_ENABLED: "true"
      INGEST_INTERVAL_MINUTES: "360"
      # Больше событий в БД: главное — фото; описание/адрес не режут импорт.
      INGEST_STRICT_EVENT_QUALITY: "true"
      EVENT_COMPLETENESS_REJECT_TICKET_MARKETING: "true"
      # adm.izh.ru / afisha: в контейнере часто падает verify TLS
      ADM_IZH_VERIFY_SSL: "false"
      AFISHA_GORODA_VERIFY_SSL: "false"
      # Assistant (by default uses deterministic fallback; enable LLM by setting ASSISTANT_PROVIDER=llamacpp_http)
      ASSISTANT_PROVIDER: ${ASSISTANT_PROVIDER:-rules}
      ASSISTANT_BASE_URL: ${ASSISTANT_BASE_URL:-http://llm:8080/v1}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-Qwen2.5-0.5B-Instruct}
      ASSISTANT_MAX_TOKENS: ${ASSISTANT_MAX_TOKENS:-256}
      ASSISTANT_TEMPERATURE: ${ASSISTANT_TEMPERATURE:-0.2}
      ASSISTANT_TIMEOUT: ${ASSISTANT_TIMEOUT:-120.0}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  pytest:
    profiles: ["test"]
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/technostrelka_test
      ADMIN_API_KEY: pytest-admin-key
      SECRET_KEY: pytest-secret-key-for-jwt
      PUBLIC_BASE_URL: http://testserver
      UPLOAD_DIR: /tmp/pytest-uploads
      INGEST_ENABLED: "false"
    command: pytest tests/ -v --tb=short
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./tests:/app/tests:ro
      - ./app:/app/app:ro

  # Реальные HTTP-вызовы к поднятому api (без моков). Запуск: docker compose --profile live run --rm live-pytest
  live-pytest:
    profiles: ["live"]
    build: .
    environment:
      LIVE_BACKEND_URL: http://api:8000
      LIVE_ADMIN_API_KEY: docker-admin-key
    command: pytest tests/integration -v -m live --tb=short
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./tests:/app/tests:ro

volumes:
  pgdata:
  uploads_data:
